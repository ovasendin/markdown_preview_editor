# Serves the site on http://localhost:PORT (default 8080, e.g. PORT=3000 docker compose ...). Put it behind your HTTPS reverse
# proxy (or use deploy/Caddyfile) before exposing it to the internet.
services:
  markdown-preview-editor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
