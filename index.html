<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Markdown editor and previewer. Documents are processed only in your browser and are never sent anywhere.">
    <title>Markdown Preview Editor</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="/browser-check.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <h1 class="sr-only">Markdown Preview Editor</h1>
      <header class="topbar">
        <div class="brand" title="Markdown Preview Editor">
          <span class="brand-mark" aria-hidden="true">M↓</span>
          <span class="brand-name">Markdown Preview</span>
        </div>
        <div class="topbar-group" id="file-actions"></div>
        <div class="spacer"></div>
        <div class="segmented" id="view-mode" role="radiogroup" aria-label="View mode" data-i18n-aria="header.viewMode"></div>
        <button type="button" id="protection-btn" class="protection-btn"></button>
        <button type="button" id="theme-btn" class="icon-btn" title="Toggle theme"></button>
        <button type="button" id="settings-btn" class="icon-btn" title="Settings" data-i18n-title="settings.title"></button>
        <button type="button" id="menu-btn" class="icon-btn menu-btn" title="Menu" data-i18n-title="menu.title" data-i18n-aria="menu.title"></button>
      </header>

      <main class="workspace" id="workspace" data-view="both">
        <section class="pane editor-pane" id="editor-pane" aria-label="Editor" data-i18n-aria="pane.editor">
          <div class="tabs-row">
            <div class="tabs" id="tabs" role="tablist"></div>
            <button type="button" id="toolbar-toggle" class="toolbar-toggle" aria-controls="toolbar" aria-expanded="false"></button>
          </div>
          <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting" data-i18n-aria="toolbar.formatting"></div>
          <div class="toolbar toolbar-advanced" id="toolbar-advanced" role="toolbar" aria-label="Advanced editor" data-i18n-aria="tb.advanced" hidden></div>
          <div class="editor-host" id="editor-host"></div>
          <div class="drop-overlay" id="drop-overlay" hidden>
            <div class="drop-card">
              <div class="drop-icon" id="drop-icon"></div>
              <div class="drop-title" data-i18n="drop.title">Drop to open</div>
              <div class="drop-hint">
                <span data-i18n="drop.hint1">.md, .txt, images, audio, video or a whole folder.</span><br>
                <span data-i18n="drop.hint2">Files are read only in your browser and are never uploaded.</span>
              </div>
            </div>
          </div>
        </section>
        <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize panes" data-i18n-aria="pane.resize" tabindex="0"></div>
        <section class="pane preview-pane" id="preview-pane" aria-label="Preview" data-i18n-aria="pane.preview">
          <div class="preview-host" id="preview-host"></div>
        </section>
      </main>

      <footer class="statusbar">
        <div class="status-left" id="status-counts"></div>
        <div class="status-right">
          <button type="button" class="status-issues" id="status-issues" hidden></button>
          <span class="status-encoding" id="status-encoding"></span>
          <span class="status-private" id="status-private" data-i18n-title="status.privateTitle"><span class="status-private-text" data-i18n="status.private">Only in your browser</span></span>
          <a class="status-a11y" href="https://github.com/ovasendin/markdown_preview_editor/blob/master/tests/e2e/a11y.spec.ts" target="_blank" rel="noopener noreferrer" title="Accessibility test (axe-core)"><img src="/wcag-badge.svg" alt="WCAG 2.2 AA: 0 violations (axe-core)" width="212" height="18"></a>
        </div>
      </footer>
    </div>

    <div id="protection-panel" class="popover protection-panel" role="dialog" aria-label="Protection" data-i18n-aria="prot.panel" hidden>
      <label class="check check-main">
        <input type="checkbox" id="prot-full" checked>
        <span class="check-box" aria-hidden="true"></span>
        <span class="check-text">
          <span class="check-title" data-i18n="prot.full">Full protection</span>
          <span class="check-desc" data-i18n="prot.fullDesc"></span>
        </span>
      </label>
      <div class="perm-title" data-i18n="prot.permissions">Permissions</div>
      <label class="check">
        <input type="checkbox" id="prot-links">
        <span class="check-box" aria-hidden="true"></span>
        <span class="check-text">
          <span class="check-title" data-i18n="prot.links">Allow links</span>
          <span class="check-desc" data-i18n="prot.linksDesc"></span>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="prot-images">
        <span class="check-box" aria-hidden="true"></span>
        <span class="check-text">
          <span class="check-title" data-i18n="prot.images">Allow external images</span>
          <span class="check-desc" data-i18n="prot.imagesDesc"></span>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="prot-media">
        <span class="check-box" aria-hidden="true"></span>
        <span class="check-text">
          <span class="check-title" data-i18n="prot.media">Allow external audio &amp; video</span>
          <span class="check-desc" data-i18n="prot.mediaDesc"></span>
        </span>
      </label>
      <div class="prot-note">
        <strong data-i18n="prot.checkTitle">Lightweight threat check.</strong>
        <span data-i18n="prot.checkText"></span>
      </div>
      <div class="prot-note prot-note-muted" data-i18n="prot.localNote"></div>
    </div>

    <div id="settings-panel" class="popover settings-panel" role="dialog" aria-label="Settings" data-i18n-aria="settings.title" hidden>
      <label class="select-row">
        <span data-i18n="settings.language">Language</span>
        <select id="set-lang"></select>
      </label>
      <hr>
      <label class="switch"><input type="checkbox" id="set-sync"><span data-i18n="settings.sync">Synchronized scrolling</span></label>
      <label class="switch"><input type="checkbox" id="set-remember"><span data-i18n="settings.remember">Remember documents in this browser</span></label>
      <p class="settings-note" id="remember-note"></p>
      <hr>
      <button type="button" class="btn btn-danger btn-block" id="clear-all" data-i18n="settings.clear">Clear everything</button>
      <p class="settings-note" data-i18n="settings.clearNote"></p>
      <hr>
      <p class="settings-note" data-i18n="settings.privacy"></p>
    </div>

    <div id="heading-menu" class="popover menu" role="menu" hidden></div>
    <div id="mobile-menu" class="popover menu" role="menu" hidden></div>

    <input type="file" id="file-input" multiple hidden accept=".md,.markdown,.mdown,.mkd,.mkdn,.mdx,.txt,image/*,audio/*,video/*">
    <input type="file" id="folder-input" webkitdirectory multiple hidden>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
