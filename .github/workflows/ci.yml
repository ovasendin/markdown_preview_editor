name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Uses the Google Chrome preinstalled on GitHub-hosted runners.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: release/markdown-preview-editor-site.zip
