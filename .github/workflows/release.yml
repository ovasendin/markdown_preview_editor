name: Release

# Push a tag like v1.0.0 to publish a GitHub Release with the ready-to-upload site archives.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/markdown-preview-editor-site.zip
          release/markdown-preview-editor-site.tar.gz
          --title "$GITHUB_REF_NAME"
          --generate-notes
