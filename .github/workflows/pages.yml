name: Deploy

# On every push to the main branch:
#  1. builds and tests the editor and uploads it to https://app.mdprevieweditor.com over FTPS;
#  2. publishes a redirect page to GitHub Pages, so old github.io links keep working.
#
# One-time setup: Settings → Secrets and variables → Actions → Repository secrets:
#   FTP_SERVER    FTP host of the hosting account
#   FTP_USERNAME  FTP account whose home folder is the app.mdprevieweditor.com document root
#   FTP_PASSWORD  password of that FTP account
# GitHub Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    environment:
      name: app
      url: https://app.mdprevieweditor.com/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Uploads only changed files; .htaccess (security headers) goes along with them.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

  # Switches github.io over only after the new address has been updated successfully.
  redirect:
    needs: app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/github-pages
      - id: deployment
        uses: actions/deploy-pages@v5
